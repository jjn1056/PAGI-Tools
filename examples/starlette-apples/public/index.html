<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apple Manager</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f1e8;
      color: #292b28;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header, main { width: min(64rem, calc(100% - 2rem)); margin-inline: auto; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: 1.25rem;
    }
    header a { color: #365e4b; }
    h1, h2 { line-height: 1.1; }
    h1 { margin-bottom: .35rem; font-size: clamp(2rem, 6vw, 3.5rem); }
    main { padding-bottom: 3rem; }
    .intro { max-width: 42rem; color: #5e635e; }
    .layout {
      display: grid;
      grid-template-columns: minmax(16rem, 22rem) 1fr;
      gap: 1.25rem;
      align-items: start;
      margin-top: 2rem;
    }
    .panel, .apple {
      border: 1px solid #d8d3c6;
      border-radius: .85rem;
      background: #fff;
      box-shadow: 0 .4rem 1.4rem rgba(45, 48, 43, .08);
    }
    .panel { padding: 1.25rem; }
    form { display: grid; gap: .85rem; }
    label { display: grid; gap: .35rem; font-weight: 650; }
    input, button {
      border: 1px solid #aaa697;
      border-radius: .55rem;
      padding: .7rem .8rem;
      font: inherit;
    }
    input { background: transparent; }
    button { cursor: pointer; background: #365e4b; color: #fff; border-color: #365e4b; }
    button.secondary { background: transparent; color: inherit; border-color: #aaa697; }
    button.danger { background: #874b47; border-color: #874b47; }
    .actions { display: flex; gap: .55rem; flex-wrap: wrap; }
    #apple-list { display: grid; gap: .8rem; }
    .apple { padding: 1rem 1.1rem; }
    .apple h3 { margin: 0 0 .3rem; }
    .apple p { margin: 0 0 .8rem; color: #5e635e; }
    #status { min-height: 1.5rem; margin-top: 1rem; }
    #status.error { color: #98463f; }
    @media (max-width: 44rem) { .layout { grid-template-columns: 1fr; } }
    @media (prefers-color-scheme: dark) {
      :root { background: #20231f; color: #eceeea; }
      header a { color: #a6cfb4; }
      .intro, .apple p { color: #b8bdb7; }
      .panel, .apple { background: #2b302b; border-color: #454a44; }
      input { border-color: #6b716a; }
      button.secondary { border-color: #6b716a; }
    }
  </style>
</head>
<body>
  <header>
    <strong>PAGI example</strong>
    <a href="/welcome">Welcome to PAGI</a>
  </header>
  <main>
    <h1>Apple Manager</h1>
    <p class="intro">A small dependency-free SPA backed by the JSON routes in this example.</p>

    <div class="layout">
      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">Add an apple</h2>
        <form id="apple-form">
          <label>Name <input name="name" required autocomplete="off"></label>
          <label>Color <input name="color" required autocomplete="off"></label>
          <div class="actions">
            <button type="submit">Save apple</button>
            <button type="button" id="cancel-edit" class="secondary" hidden>Cancel edit</button>
          </div>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </section>

      <section id="apple-list" aria-labelledby="list-title" aria-live="polite">
        <h2 id="list-title">Apples</h2>
      </section>
    </div>
  </main>

  <script>
    const API_ROOT = '/apples';
    const form = document.querySelector('#apple-form');
    const formTitle = document.querySelector('#form-title');
    const list = document.querySelector('#apple-list');
    const status = document.querySelector('#status');
    const cancelEdit = document.querySelector('#cancel-edit');
    let editingId = null;

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    async function api(path = '', options = {}) {
      const response = await fetch(`${API_ROOT}${path}`, {
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
        ...options,
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || data.detail || response.statusText);
      return data;
    }

    function resetForm() {
      editingId = null;
      form.reset();
      formTitle.textContent = 'Add an apple';
      cancelEdit.hidden = true;
    }

    function beginEdit(apple) {
      editingId = apple.id;
      form.elements.name.value = apple.name;
      form.elements.color.value = apple.color;
      formTitle.textContent = `Edit ${apple.name}`;
      cancelEdit.hidden = false;
      form.elements.name.focus();
    }

    function appleCard(apple) {
      const article = document.createElement('article');
      article.className = 'apple';

      const heading = document.createElement('h3');
      heading.textContent = apple.name;
      const color = document.createElement('p');
      color.textContent = apple.color;

      const actions = document.createElement('div');
      actions.className = 'actions';
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'secondary';
      edit.textContent = 'Edit';
      edit.addEventListener('click', () => beginEdit(apple));

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'danger';
      remove.textContent = 'Delete';
      remove.addEventListener('click', async () => {
        if (!confirm(`Delete ${apple.name}?`)) return;
        try {
          await api(`/${apple.id}`, { method: 'DELETE' });
          if (editingId === apple.id) resetForm();
          setStatus(`${apple.name} deleted.`);
          await loadApples();
        } catch (error) {
          setStatus(error.message, true);
        }
      });

      actions.append(edit, remove);
      article.append(heading, color, actions);
      return article;
    }

    async function loadApples() {
      try {
        const apples = await api();
        list.replaceChildren(Object.assign(document.createElement('h2'), {
          id: 'list-title', textContent: 'Apples',
        }));
        apples.forEach(apple => list.append(appleCard(apple)));
        if (!apples.length) {
          const empty = document.createElement('p');
          empty.textContent = 'No apples yet.';
          list.append(empty);
        }
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(form));
      const path = editingId === null ? '' : `/${editingId}`;
      const method = editingId === null ? 'POST' : 'PUT';
      try {
        const apple = await api(path, { method, body: JSON.stringify(data) });
        resetForm();
        setStatus(`${apple.name} saved.`);
        await loadApples();
      } catch (error) {
        setStatus(error.message, true);
      }
    });

    cancelEdit.addEventListener('click', resetForm);
    loadApples();
  </script>
</body>
</html>
